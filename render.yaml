databases:
  - name: ams-db
    databaseName: ams
    user: ams
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: ams-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c 'alembic upgrade head && exec python -m app.server'
    healthCheckPath: /health/ready
    envVars:
      - key: AMS_ENV
        value: production
      - key: AMS_API_PREFIX
        value: /api
      - key: AMS_DATABASE_URL
        fromDatabase:
          name: ams-db
          property: connectionString
      - key: AMS_DATABASE_POOL_SIZE
        value: "5"
      - key: AMS_DATABASE_MAX_OVERFLOW
        value: "10"
      - key: AMS_HTTP_REQUEST_CONCURRENCY
        value: "15"
      - key: AMS_SECRET_KEY
        generateValue: true
      - key: AMS_COOKIE_SAMESITE
        value: none
      - key: AMS_CORS_ORIGINS
        sync: false
      - key: AMS_FRONTEND_BASE_URL
        sync: false
      - key: AMS_STORAGE_BACKEND
        value: s3
      - key: AMS_S3_BUCKET
        sync: false
      - key: AMS_S3_REGION
        sync: false
      - key: AMS_S3_ENDPOINT_URL
        sync: false
      - key: AMS_S3_ACCESS_KEY_ID
        sync: false
      - key: AMS_S3_SECRET_ACCESS_KEY
        sync: false
      - key: AMS_SMTP_HOST
        sync: false
      - key: AMS_SMTP_PORT
        value: "587"
      - key: AMS_SMTP_USERNAME
        sync: false
      - key: AMS_SMTP_PASSWORD
        sync: false
      - key: AMS_SMTP_FROM_EMAIL
        sync: false
      - key: AMS_TWILIO_ACCOUNT_SID
        sync: false
      - key: AMS_TWILIO_AUTH_TOKEN
        sync: false
      - key: AMS_TWILIO_FROM_NUMBER
        sync: false

  - type: worker
    name: ams-notifications
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.workers.run
    envVars:
      - key: AMS_ENV
        value: production
      - key: AMS_DATABASE_URL
        fromDatabase:
          name: ams-db
          property: connectionString
      - key: AMS_DATABASE_POOL_SIZE
        value: "5"
      - key: AMS_DATABASE_MAX_OVERFLOW
        value: "10"
      - key: AMS_SECRET_KEY
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SECRET_KEY
      - key: AMS_COOKIE_SAMESITE
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_COOKIE_SAMESITE
      - key: AMS_CORS_ORIGINS
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_CORS_ORIGINS
      - key: AMS_FRONTEND_BASE_URL
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_FRONTEND_BASE_URL
      - key: AMS_STORAGE_BACKEND
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_STORAGE_BACKEND
      - key: AMS_S3_BUCKET
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_S3_BUCKET
      - key: AMS_S3_REGION
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_S3_REGION
      - key: AMS_S3_ENDPOINT_URL
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_S3_ENDPOINT_URL
      - key: AMS_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_S3_ACCESS_KEY_ID
      - key: AMS_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_S3_SECRET_ACCESS_KEY
      - key: AMS_SMTP_HOST
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SMTP_HOST
      - key: AMS_SMTP_PORT
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SMTP_PORT
      - key: AMS_SMTP_USERNAME
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SMTP_USERNAME
      - key: AMS_SMTP_PASSWORD
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SMTP_PASSWORD
      - key: AMS_SMTP_FROM_EMAIL
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_SMTP_FROM_EMAIL
      - key: AMS_TWILIO_ACCOUNT_SID
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_TWILIO_ACCOUNT_SID
      - key: AMS_TWILIO_AUTH_TOKEN
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_TWILIO_AUTH_TOKEN
      - key: AMS_TWILIO_FROM_NUMBER
        fromService:
          type: web
          name: ams-api
          envVarKey: AMS_TWILIO_FROM_NUMBER
