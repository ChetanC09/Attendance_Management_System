services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ams}
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams} -d ${POSTGRES_DB:-ams}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      AMS_CORS_ORIGINS: ${AMS_CORS_ORIGINS}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/scripts/seed_demo.py:/srv/ams/scripts/seed_demo.py:ro
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.server"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["python", "-m", "app.workers.run"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
