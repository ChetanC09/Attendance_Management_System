[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ams-backend"
version = "0.1.0"
description = "FastAPI backend for the Attendance Management System"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.34,<2",
  "fastapi>=0.111,<1",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "python-multipart>=0.0.9,<1",
  "pyjwt>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.5,<1"]
vision = ["insightface>=0.7,<1", "onnxruntime>=1.18,<2", "opencv-python-headless>=4.10,<5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]
